# Database (schema is owned by Flyway: db/migration)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/jf_mart_db}
spring.datasource.username=${DB_USERNAME:jfmart_app_user}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: JWT_SECRET must be at least 32 characters
jfmart.jwt.secret=${JWT_SECRET}
jfmart.jwt.expiration-minutes=720

# How long a courier's QR code can be scanned after it is shown
jfmart.qr.expiry-minutes=30

# Clients pay within this many days of delivery
jfmart.billing.payment-terms-days=30

# One-time creation of the single admin and courier accounts (skipped if the password is unset)
jfmart.bootstrap.admin-username=${ADMIN_USERNAME:admin}
jfmart.bootstrap.admin-password=${ADMIN_PASSWORD:}
jfmart.bootstrap.courier-username=${COURIER_USERNAME:courier}
jfmart.bootstrap.courier-password=${COURIER_PASSWORD:}
