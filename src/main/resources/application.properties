# Database URL with SSL enforced for Data in Transit security
spring.datasource.url=jdbc:mysql://localhost:3306/jf_mart_db?useSSL=true&requireSSL=true&verifyServerCertificate=false
spring.datasource.username=jfmart_app_user
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false