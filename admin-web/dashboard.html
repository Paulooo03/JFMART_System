<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - JFMART Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="wireframe-bg">
    <div class="board-container">
        <h2 class="page-title">Dashboard</h2>

        <div id="page-error" class="error-message"></div>
        <div id="summary" class="cards"></div>

        <div class="dashboard-layout">
            <!-- Placeholder for the planned product-demand forecast -->
            <div class="forecast-panel">
                <div class="empty-state">
                    <p class="big">No forecast data available</p>
                    <p class="muted">Prediction logs will appear here once generated.</p>
                </div>
                <p class="panel-caption">Product-Demand Forecast</p>
            </div>

            <!-- Navigation Buttons -->
            <div class="nav-grid">
                <a href="clients.html" class="nav-btn">Clients</a>
                <a href="products.html" class="nav-btn">Products</a>
                <a href="orders.html" class="nav-btn">Orders</a>
                <a href="deliveries.html" class="nav-btn">Deliveries</a>
                <a href="invoices.html" class="nav-btn">Invoices &amp; payments</a>
                <a href="records.html" class="nav-btn">Records</a>
            </div>
        </div>

        <div class="dashboard-footer">
            <button id="logout-btn" class="btn btn-gray">Logout</button>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
