<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records - JFMART Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="wireframe-bg">
    <div class="board-container">
        <div class="top-nav">
            <a href="dashboard.html" class="btn btn-gray">Back</a>
        </div>

        <h2 class="page-title">Records</h2>
        <div id="page-error" class="error-message"></div>

        <div class="toolbar">
            <select id="client-select" class="input compact"></select>
            <span class="spacer"></span>
            <button id="export-btn" type="button" class="btn btn-gray btn-small" disabled>Export to Excel</button>
        </div>

        <div id="summary" class="cards"></div>

        <div class="records-dual-panel">
            <!-- Panel 1: Order History -->
            <div class="record-box">
                <h3>Order history</h3>
                <div class="record-scroll-view" id="order-history-view">
                    <p class="muted">Choose a client to see their orders.</p>
                </div>
            </div>

            <!-- Panel 2: Client Transactions -->
            <div class="record-box">
                <h3>Client transactions</h3>
                <div class="record-scroll-view" id="client-transactions-view">
                    <p class="muted">Choose a client to see their invoices and payments.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/records.js"></script>
</body>
</html>
