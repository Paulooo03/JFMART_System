<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List - JFMART Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="wireframe-bg">
    <div class="board-container">
        <div class="top-nav">
            <a href="dashboard.html" class="btn btn-gray">Back</a>
        </div>

        <h2 class="page-title">Product list</h2>
        <div id="page-error" class="error-message"></div>

        <div class="content-panel">
            <div class="panel-header-actions">
                <p class="panel-instruction">Products and the prices clients see. Inactive products are hidden from clients.</p>
                <button id="add-product-btn" class="btn btn-primary">+ Add Product</button>
            </div>
            <div class="toolbar">
                <input id="product-search" class="input compact" type="search" placeholder="Search products">
                <label class="check"><input id="show-inactive" type="checkbox" checked> Show inactive</label>
            </div>

            <div class="table-wrap">
                <table class="data-table" id="products-table">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th class="num">Unit Price</th>
                            <th>Preferred Unit</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-list-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
