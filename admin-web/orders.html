<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Orders - JFMART Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="wireframe-bg">
    <div class="board-container">
        <div class="top-nav">
            <a href="dashboard.html" class="btn btn-gray">Back</a>
        </div>

        <h2 class="page-title">Pending Orders</h2>

        <div class="content-panel">
            <p class="panel-instruction">Display orders, order details, and order status</p>
            
            <table class="data-table" id="orders-table">
                <thead>
                    <tr>
                        <th>Order #</th>
                        <th>Client Name</th>
                        <th>Order Items & Custom Requests</th>
                        <th>Total Estimated Cost</th>
                        <th>Current Status</th>
                        <th>Update Status / Action</th>
                    </tr>
                </thead>
                <tbody id="orders-list-body">
                    <!-- Dynamic order rows loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
